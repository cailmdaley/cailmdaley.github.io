<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Banjo Learns</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap">
<style>
/* Layout: one engraved plate on a table. The banjo lies across the top, its head the centrepiece;
   the spectrum hangs under the neck and the loss strip runs along the foot as the scrubber.
   Everything is drawn on one canvas; transparent buttons sit over the tags for keys and screen readers. */
:root {
  --table: #ebe6da;      /* the surface the plate lies on */
  --paper: #f2e8cf;      /* the plate */
  --vellum: #f8f1dc;     /* the drum head */
  --ink: #2a2119;
  --ink-2: #6f604b;
  --wood: #c4924f;       /* ochre pencil: maple */
  --board: #5e3f28;      /* umber pencil: the fingerboard */
  --metal: #8b8d88;
  --skin: #d8a284;
  --rec: #3c5d89;        /* blue pencil: the recording */
  --model: #b0452c;      /* madder pencil: the model */
  --graphite: #4b4b55;   /* the head's other sign */
  --vignette: 0;
  --shadow: rgba(60, 45, 20, .18);
  --text: "IM Fell English", "Iowan Old Style", Palatino, Georgia, serif;
  --table-ink: #6f604b; --table-ink-on: #2a2119;   /* lettering on the table, off the plate */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --table: #15110d; --paper: #c7b38b; --vellum: #d1bf98; --ink: #22180e; --ink-2: #4c3e2c;
    --wood: #a3743a; --board: #4a2f1d; --metal: #6a6b66; --skin: #b98466; --rec: #283f69; --model: #8d2f1b;
    --graphite: #35343a; --vignette: .42; --shadow: rgba(0, 0, 0, .55); color-scheme: dark;
    --table-ink: #a39376; --table-ink-on: #eadfc6;
  }
}
:root[data-theme="dark"] {
  --table: #15110d; --paper: #c7b38b; --vellum: #d1bf98; --ink: #22180e; --ink-2: #4c3e2c;
  --wood: #a3743a; --board: #4a2f1d; --metal: #6a6b66; --skin: #b98466; --rec: #283f69; --model: #8d2f1b;
  --graphite: #35343a; --vignette: .42; --shadow: rgba(0, 0, 0, .55); color-scheme: dark;
    --table-ink: #a39376; --table-ink-on: #eadfc6;
}
html, body { height: 100%; }
body { margin: 0; background: var(--table); color: var(--ink); font-family: var(--text); }
.sheet {
  min-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.plate { position: relative; max-width: 100%; box-shadow: 0 1px 2px var(--shadow), 0 10px 34px var(--shadow); background: var(--paper); touch-action: manipulation; }
.plate canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hit { position: absolute; margin: 0; padding: 0; border: 0; background: transparent; cursor: pointer; border-radius: 3px; color: transparent; font: inherit; }
.hit:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.zone { position: absolute; cursor: crosshair; border-radius: 2px; }
.zone:focus-visible { outline: 1.5px dashed var(--ink); outline-offset: 3px; }
.card {
  position: absolute; z-index: 5; box-sizing: border-box; max-width: min(360px, calc(100% - 24px)); max-height: 70%;
  overflow: auto; padding: 14px 18px 12px; background: var(--vellum); color: var(--ink);
  border: 1px solid var(--ink); box-shadow: 3px 4px 0 var(--shadow), 0 8px 24px var(--shadow);
  font-size: 15px; line-height: 1.42;
}
.card h2 { margin: 0 0 6px; font-weight: 400; font-size: 19px; letter-spacing: .01em; text-wrap: balance; }
.card dl { margin: 0; display: grid; gap: 8px; }
.card dt { font-style: italic; color: var(--ink-2); }
.card dd { margin: 0; }
.card ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.card .src { margin-top: 10px; font-size: 13px; color: var(--ink-2); }
.card .x { position: absolute; top: 6px; right: 8px; border: 0; background: none; font: inherit; font-size: 20px; color: var(--ink-2); cursor: pointer; padding: 2px 6px; }
.card .x:focus-visible { outline: 2px solid var(--ink); }
.msg { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; font-size: 17px; font-style: italic; }
.msg[hidden], .card[hidden] { display: none; }
/* the pages this plate is published with, as a quiet line above it */
.pages { align-self: stretch; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 0; margin: 0 0 10px; font-size: 16px; font-style: italic; }
.pages a { color: var(--table-ink); text-decoration: none; padding: 6px 2px; }
.pages a[aria-current] { color: var(--table-ink-on); text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
.pages a:focus-visible { outline: 2px solid var(--table-ink-on); outline-offset: 2px; }
.pages .sep { color: var(--table-ink); padding: 6px 10px; }
</style>
<style>
/* inside the Almanac page: the plate lies on the page's own paper */
body { background: transparent; }
.sheet { min-height: 0; justify-content: flex-start; }
</style>
</head>

    <div class="card" id="card" role="dialog" aria-modal="false" hidden></div>
    <div class="msg" id="msg" hidden></div>
  </div>
</main>

  stripZone.setAttribute('aria-valuetext', `step ${ck.step}, loss ${D.loss[ck.step].toFixed(3)}`);
}
function scrubDone() { hear('model', nearestCk(st.target ?? st.step)); }
function selectNote(i) {
  const was = st.playing;
  st.note = i; if (was) stopFit();
  buildStatic(); rest();
  if (was) startFit();
}

/* ---------- audio ---------- */
let AC = null, master = null;
const buffers = new Map(), voices = new Set();
function ensureAudio() {
  if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 3.2; master.connect(AC.destination); }
  if (AC.state === 'suspended') AC.resume();
}
function loadBuf(rel) {
  if (buffers.has(rel)) return buffers.get(rel);
  const get = n => fetch(DATA + rel).then(r => { if (!r.ok) throw new Error(rel + ': ' + r.status); return r.arrayBuffer(); })
    .catch(e => { if (n > 0) return new Promise(res => setTimeout(res, 250)).then(() => get(n - 1)); throw e; });
  const p = get(2).then(b => AC.decodeAudioData(b));
  buffers.set(rel, p); p.catch(() => buffers.delete(rel)); return p;
}
async function loadAll(rels) { const q = [...rels]; const w = async () => { while (q.length) await loadBuf(q.shift()); }; await Promise.all([0, 1, 2, 3].map(w)); }
function stopVoice(at_ = AC ? AC.currentTime : 0) {
  for (const { src, g } of voices) { g.gain.cancelScheduledValues(at_); g.gain.setValueAtTime(g.gain.value, at_); g.gain.linearRampToValueAtTime(0, at_ + .05); try { src.stop(at_ + .06); } catch (e) {} }
  voices.clear();
}
function playBuf(buf, when, dur) {
  const src = AC.createBufferSource(), g = AC.createGain();
  src.buffer = buf; src.connect(g); g.connect(master); g.gain.setValueAtTime(1, when); src.start(when);
  if (dur) { g.gain.setValueAtTime(1, when + dur - .07); g.gain.linearRampToValueAtTime(0, when + dur); src.stop(when + dur + .01); }
  const v = { src, g }; voices.add(v); src.addEventListener('ended', () => voices.delete(v)); return v;
}
const noteId = () => note().id;
// The model's note at a checkpoint: as recorded through the chain, or the instrument alone.
const ckRel = ck => { const k = D.checkpoints[ck]; return (st.dry && k.dry_audio ? k.dry_audio : k.audio)[noteId()]; };
async function hear(kind, ck) {
  ensureAudio(); stopFit();
  const rel = kind === 'ref' ? D.reference_audio[noteId()] : ckRel(ck);
  try {
    const buf = await loadBuf(rel); stopVoice();
    const when = AC.currentTime + .03, v = playBuf(buf, when);
    st.nowItem = { kind, ck, b: st.target ?? st.step }; pluck();
    v.src.onended = () => { voices.delete(v); if (!st.playing && st.nowItem && st.nowItem.kind === kind && st.nowItem.ck === ck) { st.nowItem = null; kick(); } };
  } catch (e) { soundError(e); }
}
function soundError(e) { const m = $('msg'); m.hidden = false; m.textContent = `Could not load the sound (${String(e.message || e)}). The audio folder should sit beside trajectory.json.`; setTimeout(() => m.hidden = true, 4000); }
// Play the fit: each heard step's note in turn, from the first; the drawing moves to that
// step as its note starts.
function buildPlan() {
  return D.checkpoints.map((k, i) => ({ kind: 'model', ck: i, start: i * CLIP_S, dur: CLIP_S, a: i ? D.checkpoints[i - 1].step : st.step, b: k.step }));
}
async function startFit() {
  ensureAudio(); stopVoice(); st.nowItem = null; st.target = null;
  st.loading = true; kick();
  try { await loadAll(D.checkpoints.map((c, i) => ckRel(i))); }
  catch (e) { st.loading = false; soundError(e); return; }
  st.loading = false;
  st.plan = buildPlan(); st.planT0 = AC.currentTime + .08; st.planIdx = 0; st.playing = true; kick();
}
function stopFit() {
  if (!st.playing) return;
  if (st.nowItem) st.step = st.nowItem.b;
  st.playing = false; st.plan = null; stopVoice(); st.nowItem = null; kick();
}
async function schedule() {
  const plan = st.plan; if (!plan) return;
  const now = AC.currentTime;
  while (st.planIdx < plan.length && st.planT0 + plan[st.planIdx].start < now + .25) {
    const it = plan[st.planIdx++], when = st.planT0 + it.start;
    const rel = it.kind === 'ref' ? D.reference_audio[noteId()] : ckRel(it.ck);
    const buf = await loadBuf(rel); if (st.plan !== plan) return;
    playBuf(buf, Math.max(when, AC.currentTime + .01), st.planIdx === plan.length ? 0 : it.dur);
  }
}
function tickFit() {
  const plan = st.plan, now = AC.currentTime - st.planT0;
  let it = null; for (const x of plan) if (now >= x.start) it = x;
  if (!it) return;
  if (st.nowItem !== it) { st.nowItem = it; pluck(); }
  const u = clamp((now - it.start) / MORPH_S, 0, 1);
  st.step = lerp(it.a, it.b, u * u * (3 - 2 * u));
  const end = plan[plan.length - 1];
  if (now > end.start + end.dur) { st.playing = false; st.plan = null; st.nowItem = null; st.step = end.b; }
}

/* ---------- the frame ---------- */
let raf = 0;
function kick() { if (!raf) raf = requestAnimationFrame(frame); }
function frame() {
  raf = 0;
  if (!D) return;
  const nowMs = performance.now(), dt = Math.min(.1, (nowMs - (st.lastFrame || nowMs)) / 1000);
  st.lastFrame = nowMs;
  if (st.playing) { schedule(); tickFit(); }
  // the strip's glide: an exponential approach, landing exactly on the heard step
  let gliding = false;
  if (st.target != null && !st.playing) {
    st.step += (st.target - st.step) * (1 - Math.exp(-dt / EASE_S));
    if (Math.abs(st.target - st.step) < .3) { st.step = st.target; st.target = null; } else gliding = true;
  }
  const step = st.step;
  // the clock runs only while a note sounds; otherwise the frame it stopped on holds
  const moving = !reduceMotion && (st.playing || !!st.nowItem);
  let tReal = st.held;
  if (moving) {
    let el = (nowMs - st.t0) / 1000;
    if (el > LOOP_S) { st.t0 += Math.floor(el / LOOP_S) * LOOP_S * 1000; el = (nowMs - st.t0) / 1000; }
    tReal = st.held = el / slowF();
  }
  MS = modeState(step);
  const c = cx, dpr = LY.dpr;
  c.setTransform(1, 0, 0, 1, 0, 0); c.drawImage(under, 0, 0);
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawHead(c, tReal);
  c.setTransform(1, 0, 0, 1, 0, 0); c.drawImage(over, 0, 0);
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const sm = stringModel(step);
  drawString(c, tReal, sm);
  const pick = drawPick(c, sm, step);
  drawSpectrumDyn(c, step);
  drawStripDyn(c, step);
  frameTags = [];
  if (CHAIN) drawChain(c, step);
  drawTags(c, sm, pick, step);
  syncHits();
  if (moving || gliding || st.playing || st.loading) kick(); else st.lastFrame = 0;
}

/* ---------- boot ---------- */
function rebuild() {
  if (!D) return;
  layout(); sizeCanvases(); buildStatic(); buildHeadTexture(); buildZones(); closeCard(); kick();
}
function retheme() { readTokens(); if (D) { buildStatic(); headColors(); kick(); } }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', retheme);
new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
let rz = 0;
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(rebuild, 120); });

async function boot() {
  readTokens();
  let why = '';
  for (const dir of DATA ? [DATA] : DATA_DIRS) {
    try { const r = await fetch(dir + 'trajectory.json'); if (!r.ok) { why = `${dir}trajectory.json returned ${r.status}`; continue; } D = await r.json(); DATA = dir; break; }
    catch (e) { why = `${dir}trajectory.json: ${e.message}`; }
  }
  if (!D) { layout(); sizeCanvases(); const m = $('msg'); m.hidden = false; m.textContent = `Could not load the fit (${why}). Put trajectory.json beside this page, or pass ?data=path/to/folder/.`; return; }
  S = D.series;
  CHAIN = ['room_early', 'mic_db', 'background_db', 'codec_fraction'].some(has);
  D.checkpoints.sort((a, b) => a.step - b.step);
  BEST = D.loss.indexOf(Math.min(...D.loss));
  LOSS_MIN = Math.min(...D.loss);
  LOSS_EPS = Math.max(1e-6, (Math.max(...D.loss) - LOSS_MIN) * 2e-3);
  LG_TOP = lossLg(Math.max(...D.loss)) + .08; LG_BOT = Math.log10(LOSS_EPS) - .12;
  st.note = Math.min(st.note, D.notes.length - 1);
  geometry(); buildBasis();
  rebuild();
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (D) rebuild(); });
boot();
</script>
